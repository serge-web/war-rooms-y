name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Build packages
        run: npm run build --workspaces

      - name: Build chat-ui for production
        run: npm run build --workspace=packages/chat-ui
        env:
          VITE_BACKEND_MODE: mock
          VITE_MOCK_DOMAIN: wargame.local
          VITE_MOCK_CONFERENCE: conference.wargame.local
          VITE_MOCK_PUBSUB: pubsub.wargame.local
          VITE_MOCK_PERSISTENCE: localStorage
          VITE_MOCK_LATENCY: 100
          VITE_MOCK_DEBUG: false

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/chat-ui/dist
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const repoName = context.repo.repo;
            const owner = context.repo.owner;
            const previewUrl = `https://${owner}.github.io/${repoName}/pr-${prNumber}/`;

            const comment = `## 🚀 PR Preview Deployed

            Your changes have been deployed to GitHub Pages!

            **Preview URL:** ${previewUrl}

            The preview will update automatically when you push new commits to this PR.

            ---
            <sub>Built from commit ${context.sha.substring(0, 7)}</sub>`;

            // Find existing preview comment
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo: repoName,
              issue_number: prNumber,
            });

            const existingComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('PR Preview Deployed')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo: repoName,
                comment_id: existingComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo: repoName,
                issue_number: prNumber,
                body: comment,
              });
            }
